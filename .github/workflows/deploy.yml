name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    # каждые 15 минут — обновление данных из Grist
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Забрать данные из Grist
        env:
          GRIST_API_KEY: ${{ secrets.GRIST_API_KEY }}
          PAGE_PASSPHRASE: ${{ secrets.PAGE_PASSPHRASE }}
        run: node scripts/sync-grist.mjs

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
